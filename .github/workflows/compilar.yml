# Compila e confere o site. Só publica o teste quando a mensagem do commit tem [publicar-teste].
# A publicação mexe apenas na pasta novo/ da área principal; o app atual fica como está.
name: Compilar site v2
on:
  push:
    branches: [site-v2]
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fvzxqhoexkjqzgihwhnp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MlLTRFAonNd6zXDGolg5VA_tOucA8dl
      NEXT_PUBLIC_BASE_PATH: /Honu-Kai-Reservas/novo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: bash ferramentas/conferir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
  publicar-teste:
    needs: compilar
    if: contains(github.event.head_commit.message, '[publicar-teste]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Colocar o teste em novo/
        run: |
          set -euo pipefail
          rm -rf novo && mkdir novo && cp -r "${{ runner.temp }}/site/." novo/
          git add -A -- novo
          if git diff --cached --name-only | grep -v '^novo/'; then echo "Algo fora de novo/ seria alterado"; exit 1; fi
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publica a versão de teste do site v2 em novo/"
          git push origin HEAD:main
      - name: Pedir a atualização do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
